name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tsc needs the generated Prisma Client types to exist; DATABASE_URL isn't required for
      # `generate` (only for actually talking to a database), so no secrets needed here.
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - run: npm run typecheck
