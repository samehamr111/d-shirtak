name: Keep DB warm

# Azure SQL's serverless tier auto-pauses after a period of inactivity, and the first request
# after that has to wait for it to resume -- this pings a DB-touching endpoint often enough
# during hours the store is actually likely to get traffic that it never goes idle long enough to
# pause. Deliberately does NOT run 24/7: letting it pause overnight (roughly 00:00-06:00 Cairo
# time, UTC+2 -- Egypt has no DST) keeps Azure's pay-per-use savings for the hours nobody's
# shopping anyway. Adjust the cron window below if that assumption stops being true.
on:
  schedule:
    - cron: "0,20,40 4-21 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://d-shirtak-production.up.railway.app/health/db)
          echo "Response status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::DB keep-warm ping returned $status instead of 200"
          fi
