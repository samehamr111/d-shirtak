name: Keep DB warm

# Azure SQL's serverless tier auto-pauses after a period of inactivity, and the first request
# after that has to wait for it to resume -- this pings a DB-touching endpoint often enough that
# it never goes idle long enough to pause, at any hour. That means it no longer scales to zero
# overnight -- constant low-level compute instead of Azure's pay-per-use pausing -- which is the
# deliberate tradeoff for actually eliminating cold starts around the clock instead of just during
# business hours.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://d-shirtak-production.up.railway.app/health/db)
          echo "Response status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::DB keep-warm ping returned $status instead of 200"
          fi
